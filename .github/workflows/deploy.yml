name: Deploy to GitHub Pages & Sync YouTube

on:
  push:
    branches: ["main"]
  schedule:
    # Run every 6 hours automatically to check for newly published YouTube videos
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and Sync YouTube Videos
        run: node scripts/fetch-youtube.js

      - name: Commit updated YouTube catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/data/youtube.json)" ]; then
            git add public/data/youtube.json
            git commit -m "Auto-sync YouTube catalog [skip ci]" || echo "No changes to commit"
            git push origin main || echo "Push skipped or already up-to-date"
          else
            echo "No new YouTube videos detected."
          fi

      - name: Build site
        run: npm run build

      - name: Ensure 404 fallback exists
        run: |
          cp -n dist/index.html dist/404.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
